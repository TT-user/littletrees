# Site estatico: nao ha build, a raiz do repo ja e a pasta publicada.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
